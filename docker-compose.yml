services:
  database:
    image: mysql:8.0
    container_name: chantiers-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chantiers
    ports:
      - "3306:3306"
    volumes:
      - chantiers-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chantiers-mysql-data:
